<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MatteLab 9 - Læringsstasjon</title>
  <style>
    :root {
      color-scheme: dark;
      --font-scale: 1;
      --bg: #060711;
      --bg2: #0d1020;
      --panel: rgba(18, 22, 40, 0.78);
      --panel2: rgba(28, 33, 58, 0.88);
      --line: rgba(255, 255, 255, 0.12);
      --text: #f7f8ff;
      --muted: #aeb5c8;
      --green: #41e6a0;
      --blue: #56b7ff;
      --orange: #ffb657;
      --red: #ff6476;
      --yellow: #f6d75e;
      --purple: #a78bfa;
      --pink: #ff74c7;
      --shadow: 0 28px 100px rgba(0, 0, 0, 0.48);
      --radius: 18px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body[data-theme="nebula"] {
      --bg: #060711;
      --bg2: #0d1020;
      --panel: rgba(18, 22, 40, 0.78);
      --panel2: rgba(28, 33, 58, 0.88);
      --green: #41e6a0;
      --blue: #56b7ff;
      --orange: #ffb657;
      --red: #ff6476;
      --yellow: #f6d75e;
      --purple: #a78bfa;
      --pink: #ff74c7;
    }

    body[data-theme="terminal"] {
      --bg: #030806;
      --bg2: #06130e;
      --panel: rgba(8, 22, 17, 0.84);
      --panel2: rgba(12, 35, 25, 0.9);
      --green: #56f5a4;
      --blue: #38e8ff;
      --orange: #d7ff6b;
      --red: #ff5f7a;
      --yellow: #e4ff7a;
      --purple: #8effcf;
      --pink: #5cffb1;
    }

    body[data-theme="solar"] {
      --bg: #10070c;
      --bg2: #1f1012;
      --panel: rgba(42, 23, 25, 0.82);
      --panel2: rgba(60, 32, 28, 0.9);
      --green: #85e89d;
      --blue: #ffb86b;
      --orange: #ff9f43;
      --red: #ff6b6b;
      --yellow: #ffe66d;
      --purple: #ff8bd1;
      --pink: #ff6a88;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
    }

    body {
      min-height: 100dvh;
      overflow: auto;
      font-size: calc(16px * var(--font-scale));
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      position: relative;
      display: grid;
      grid-template-columns: 292px 1fr;
      min-height: 100dvh;
      overflow: visible;
      background:
        radial-gradient(circle at 12% 12%, rgba(86, 183, 255, 0.16), transparent 30%),
        radial-gradient(circle at 88% 10%, rgba(167, 139, 250, 0.18), transparent 28%),
        radial-gradient(circle at 80% 90%, rgba(65, 230, 160, 0.12), transparent 32%),
        linear-gradient(145deg, #060711 0%, #0a1020 52%, #090812 100%);
    }

    body[data-theme="terminal"] .app {
      background:
        radial-gradient(circle at 12% 12%, rgba(86, 245, 164, 0.14), transparent 30%),
        radial-gradient(circle at 88% 10%, rgba(56, 232, 255, 0.12), transparent 28%),
        linear-gradient(145deg, #030806 0%, #06130e 52%, #020504 100%);
    }

    body[data-theme="solar"] .app {
      background:
        radial-gradient(circle at 12% 12%, rgba(255, 184, 107, 0.16), transparent 30%),
        radial-gradient(circle at 88% 10%, rgba(255, 139, 209, 0.14), transparent 28%),
        linear-gradient(145deg, #10070c 0%, #211014 52%, #0b0507 100%);
    }

    .app::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.16) 1px, transparent 1.5px),
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 90px 90px, 56px 56px, 56px 56px;
      mask-image: linear-gradient(180deg, rgba(0,0,0,0.85), transparent 88%);
      opacity: 0.72;
    }

    .sidebar {
      position: sticky;
      top: 0;
      z-index: 2;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 18px;
      min-height: 0;
      height: 100dvh;
      overflow-y: auto;
      padding: 18px;
      border-right: 1px solid var(--line);
      background: rgba(5, 7, 18, 0.76);
      backdrop-filter: blur(22px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255,255,255,0.055);
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 15px;
      background: conic-gradient(from 180deg, var(--blue), var(--green), var(--purple), var(--blue));
      color: #050711;
      font-weight: 950;
      box-shadow: 0 0 34px rgba(86, 183, 255, 0.28);
    }

    .brand h1 {
      margin: 0;
      font-size: 1.08rem;
      letter-spacing: -0.02em;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 0.84rem;
    }

    .side-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .mini-stat {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,0.055);
    }

    .mini-stat span {
      display: block;
      color: var(--muted);
      font-size: 0.72rem;
      text-transform: uppercase;
      font-weight: 800;
    }

    .mini-stat strong {
      display: block;
      margin-top: 4px;
      font-size: 1.35rem;
    }

    .nav {
      display: grid;
      gap: 9px;
      align-content: start;
      overflow: auto;
      padding-right: 2px;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 52px;
      padding: 0 13px;
      border-radius: 15px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      text-align: left;
      font-weight: 850;
      transition: 220ms ease;
    }

    .nav-btn:hover {
      color: var(--text);
      background: rgba(255,255,255,0.07);
      transform: translateX(3px);
    }

    .nav-btn.active {
      color: #fff;
      border-color: rgba(86, 183, 255, 0.35);
      background: linear-gradient(135deg, rgba(86,183,255,0.18), rgba(167,139,250,0.12));
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04), 0 0 30px rgba(86,183,255,0.12);
    }

    .nav-btn small {
      display: grid;
      place-items: center;
      min-width: 31px;
      height: 31px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      color: var(--text);
      font-size: 0.86rem;
    }

    .coach {
      padding: 14px;
      border: 1px solid rgba(246, 215, 94, 0.28);
      border-radius: var(--radius);
      background: rgba(246, 215, 94, 0.08);
      color: #fff5c4;
      line-height: 1.5;
      font-size: 0.93rem;
    }

    .main {
      position: relative;
      z-index: 1;
      min-width: 0;
      min-height: 0;
      overflow: visible;
      padding: 24px;
    }

    .view {
      display: none;
      max-width: 1320px;
      margin: 0 auto;
      animation: enter 360ms cubic-bezier(.2,.8,.2,1) both;
    }

    .view.active {
      display: block;
    }

    @keyframes enter {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.992);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 18px;
      align-items: stretch;
      margin-bottom: 18px;
    }

    .hero-card,
    .panel,
    .card,
    .lab-card,
    .quiz-card,
    .flash-stage,
    .exam-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .hero-card {
      position: relative;
      overflow: hidden;
      min-height: 270px;
      padding: 30px;
      background:
        linear-gradient(135deg, rgba(86,183,255,0.18), rgba(167,139,250,0.12) 48%, rgba(65,230,160,0.1)),
        rgba(18, 22, 40, 0.78);
    }

    .hero-card::after {
      content: "";
      position: absolute;
      right: -80px;
      top: -80px;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: inset 0 0 60px rgba(255,255,255,0.07);
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--green);
      text-transform: uppercase;
      font-weight: 950;
      font-size: 0.8rem;
      letter-spacing: 0.04em;
    }

    h2,
    h3,
    p {
      margin-top: 0;
    }

    .hero h2 {
      position: relative;
      z-index: 1;
      margin-bottom: 12px;
      max-width: 850px;
      font-size: clamp(2.2rem, 5vw, 5rem);
      line-height: 0.94;
      letter-spacing: -0.06em;
    }

    .hero p {
      position: relative;
      z-index: 1;
      max-width: 760px;
      color: #d9deec;
      line-height: 1.6;
      font-size: 1.05rem;
    }

    .hero-actions,
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .hero-actions {
      margin-top: 22px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 46px;
      padding: 0 16px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.07);
      color: var(--text);
      font-weight: 850;
      transition: 200ms ease;
      white-space: nowrap;
    }

    .btn:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.22);
    }

    .btn.primary {
      border-color: transparent;
      background: linear-gradient(135deg, var(--blue), var(--purple));
      color: #fff;
      box-shadow: 0 18px 48px rgba(86, 183, 255, 0.16);
    }

    .btn.success {
      border-color: rgba(65,230,160,0.35);
      background: rgba(65,230,160,0.12);
      color: #dfffee;
    }

    .btn.danger {
      border-color: rgba(255,100,118,0.35);
      background: rgba(255,100,118,0.12);
      color: #ffe0e4;
    }

    .mission-panel {
      padding: 20px;
    }

    .mission-list {
      display: grid;
      gap: 10px;
    }

    .mission {
      padding: 13px;
      border-radius: 15px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.055);
    }

    .mission strong {
      display: block;
      margin-bottom: 5px;
    }

    .mission span {
      display: block;
      color: var(--muted);
      line-height: 1.45;
      font-size: 0.92rem;
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .dashboard-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin-bottom: 18px;
    }

    .stat-card {
      position: relative;
      overflow: hidden;
      min-height: 150px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(18, 22, 40, 0.76);
    }

    .stat-card::after {
      content: "";
      position: absolute;
      inset: auto -34% -52% 28%;
      height: 120px;
      background: radial-gradient(circle, var(--accent, var(--blue)), transparent 68%);
      opacity: 0.22;
      filter: blur(14px);
    }

    .stat-label {
      position: relative;
      z-index: 1;
      color: var(--muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      font-weight: 900;
    }

    .stat-value {
      position: relative;
      z-index: 1;
      display: block;
      margin-top: 8px;
      font-size: 3rem;
      line-height: 1;
      font-weight: 950;
      letter-spacing: -0.05em;
    }

    .stat-card p {
      position: relative;
      z-index: 1;
      margin: 10px 0 0;
      color: var(--muted);
      line-height: 1.45;
    }

    .skill-map {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 14px;
    }

    .planet {
      position: relative;
      min-height: 170px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255,255,255,0.055);
      overflow: hidden;
      text-align: left;
      color: var(--text);
      transition: 240ms ease;
    }

    .planet:hover {
      transform: translateY(-5px);
      border-color: color-mix(in srgb, var(--topic-color) 60%, white);
      background: rgba(255,255,255,0.09);
    }

    .planet::before {
      content: "";
      position: absolute;
      right: -34px;
      top: -34px;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff, var(--topic-color) 18%, transparent 70%);
      opacity: 0.52;
    }

    .planet strong {
      position: relative;
      z-index: 1;
      display: block;
      font-size: 1.15rem;
    }

    .planet span {
      position: relative;
      z-index: 1;
      display: block;
      margin-top: 8px;
      color: var(--muted);
      line-height: 1.45;
    }

    .progress {
      height: 9px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .bar {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--green), var(--blue), var(--purple));
      transition: width 420ms ease;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }

    .chip,
    .select,
    .input {
      min-height: 42px;
      border-radius: 13px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.07);
      color: var(--text);
      padding: 0 12px;
      outline: none;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 850;
      cursor: pointer;
      transition: 200ms ease;
    }

    .chip:hover,
    .chip.active {
      border-color: var(--topic-color, var(--blue));
      background: color-mix(in srgb, var(--topic-color, var(--blue)) 18%, transparent);
    }

    .select {
      min-width: 190px;
    }

    .learn-layout {
      display: grid;
      grid-template-columns: 330px 1fr;
      gap: 16px;
    }

    .topic-list {
      display: grid;
      gap: 10px;
      align-content: start;
    }

    .topic-card {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255,255,255,0.055);
      color: var(--text);
      text-align: left;
      transition: 200ms ease;
    }

    .topic-card:hover,
    .topic-card.active {
      border-color: var(--topic-color);
      background: color-mix(in srgb, var(--topic-color) 13%, rgba(255,255,255,0.05));
      transform: translateX(3px);
    }

    .topic-card strong {
      display: block;
      margin-bottom: 5px;
    }

    .topic-card span {
      color: var(--muted);
      line-height: 1.4;
      font-size: 0.92rem;
    }

    .learn-module {
      padding: 22px;
    }

    .module-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 14px;
    }

    .module-head h2 {
      margin-bottom: 7px;
      font-size: clamp(2rem, 4vw, 3.7rem);
      line-height: 0.98;
      letter-spacing: -0.06em;
    }

    .module-head p {
      color: var(--muted);
      line-height: 1.55;
      max-width: 760px;
    }

    .depth-toggle {
      display: inline-flex;
      gap: 6px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: rgba(0,0,0,0.18);
    }

    .depth-toggle button {
      min-height: 38px;
      padding: 0 12px;
      border-radius: 11px;
      background: transparent;
      color: var(--muted);
      font-weight: 850;
    }

    .depth-toggle button.active {
      color: var(--text);
      background: rgba(255,255,255,0.12);
    }

    .learn-sections {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .info-box {
      padding: 15px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.055);
      line-height: 1.55;
    }

    .info-box h3 {
      margin-bottom: 8px;
    }

    .info-box ul,
    .info-box ol {
      margin: 0;
      padding-left: 19px;
      color: #e4e8f4;
      line-height: 1.58;
    }

    .info-box li + li {
      margin-top: 7px;
    }

    .formula-box {
      margin-top: 9px;
      padding: 12px;
      border-radius: 13px;
      border-left: 4px solid var(--topic-color, var(--blue));
      background: rgba(0,0,0,0.25);
      font-weight: 850;
    }

    .trap {
      border-left: 4px solid var(--red);
      background: rgba(255,100,118,0.09);
    }

    .example {
      border-left: 4px solid var(--green);
      background: rgba(65,230,160,0.08);
    }

    .deep {
      grid-column: 1 / -1;
      border-left: 4px solid var(--purple);
      background: rgba(167,139,250,0.09);
    }

    .quiz-wrap {
      display: grid;
      place-items: center;
      min-height: calc(100dvh - 70px);
    }

    .quiz-card {
      width: min(920px, 100%);
      padding: 24px;
    }

    .quiz-meta {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin: 16px 0;
    }

    .quiz-meta div {
      padding: 12px;
      border-radius: 14px;
      background: rgba(255,255,255,0.055);
      border: 1px solid var(--line);
    }

    .quiz-meta span {
      display: block;
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 850;
    }

    .quiz-meta strong {
      display: block;
      margin-top: 3px;
      font-size: 1.18rem;
    }

    .question {
      margin: 15px 0 18px;
      font-size: clamp(1.6rem, 3.7vw, 2.7rem);
      line-height: 1.12;
      letter-spacing: -0.04em;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .option {
      min-height: 78px;
      padding: 14px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      text-align: left;
      font-weight: 850;
      line-height: 1.35;
      transition: 180ms ease;
    }

    .option:hover {
      transform: translateY(-2px);
      border-color: var(--blue);
      background: rgba(86,183,255,0.11);
    }

    .option.correct {
      border-color: var(--green);
      background: rgba(65,230,160,0.14);
    }

    .option.wrong {
      border-color: var(--red);
      background: rgba(255,100,118,0.14);
    }

    .answer-line {
      display: flex;
      gap: 10px;
    }

    .answer-line input {
      flex: 1;
      min-width: 0;
      min-height: 54px;
      padding: 0 14px;
      border-radius: 15px;
      border: 1px solid var(--line);
      background: rgba(0,0,0,0.24);
      color: var(--text);
      outline: none;
    }

    .feedback {
      display: none;
      margin-top: 16px;
      padding: 15px;
      border-radius: 16px;
      line-height: 1.5;
      animation: pop 220ms ease both;
    }

    .feedback.show {
      display: block;
    }

    .feedback.good {
      border: 1px solid rgba(65,230,160,0.35);
      background: rgba(65,230,160,0.1);
    }

    .feedback.bad {
      border: 1px solid rgba(255,100,118,0.35);
      background: rgba(255,100,118,0.1);
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: scale(0.985);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .lab-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .lab-card {
      padding: 20px;
    }

    .lab-card h3 {
      margin-bottom: 10px;
    }

    .lab-card p {
      color: var(--muted);
      line-height: 1.5;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 12px 0;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 800;
    }

    .input,
    textarea {
      width: 100%;
      min-height: 44px;

      if (type === "choice") return { topic, difficulty, type, question, answer, options: optionsOrAnswers, explanation };
      return { topic, difficulty, type, question, answer, answers: optionsOrAnswers, explanation };
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function normalize(value) {
      return String(value).toLowerCase().trim().replace(/,/g, ".").replace(/\s+/g, "").replace(/°/g, "grader").replace(/²/g, "2").replace(/³/g, "3");
    }

    function topicProgress(key) {
      const mastered = state.mastered[key] || 0;
      const quizHits = quizQuestions.filter((item) => item.topic === key).length;
      const solvedWeight = Math.min(44, Math.round((mastered / Math.max(1, quizHits)) * 44));
      const readWeight = state.mastered[`read-${key}`] ? 26 : 0;
      const labWeight = state.mastered[`lab-${key}`] ? 16 : 0;
      const examWeight = state.mastered[`exam-${key}`] ? 14 : 0;
      return Math.min(100, solvedWeight + readWeight + labWeight + examWeight);
    }

    function averageProgress() {
      const keys = Object.keys(topics);
      return Math.round(keys.reduce((sum, key) => sum + topicProgress(key), 0) / keys.length);
    }

    function applyMapTransform() {
      const canvas = $(".mind-canvas");
      const chip = $(".mind-controls .chip");
      if (!canvas) return;
      canvas.style.transform = `translate(${state.map.x}px, ${state.map.y}px) scale(${state.map.zoom})`;
      if (chip) chip.textContent = `${Math.round(state.map.zoom * 100)}%`;
    }

    function zoomMapAt(clientX, clientY, delta) {
      const viewport = $("#mindViewport");
      if (!viewport) return;
      const rect = viewport.getBoundingClientRect();
      const oldZoom = state.map.zoom;
      const nextZoom = Math.max(0.55, Math.min(2.2, Number((oldZoom * (delta > 0 ? 0.9 : 1.1)).toFixed(3))));
      const px = clientX - rect.left;
      const py = clientY - rect.top;
      const worldX = (px - state.map.x) / oldZoom;
      const worldY = (py - state.map.y) / oldZoom;
      state.map.zoom = nextZoom;
      state.map.x = px - worldX * nextZoom;
      state.map.y = py - worldY * nextZoom;
      applyMapTransform();
    }

    function attachMindmapControls() {
      const viewport = $("#mindViewport");
      if (!viewport) return;

      viewport.addEventListener("wheel", (event) => {
        event.preventDefault();
        zoomMapAt(event.clientX, event.clientY, event.deltaY);
      }, { passive: false });

      viewport.addEventListener("pointerdown", (event) => {
        if (event.target.closest(".mind-node")) return;
        state.map.dragging = true;
        state.map.dragStartX = event.clientX;
        state.map.dragStartY = event.clientY;
        state.map.dragOriginX = state.map.x;
        state.map.dragOriginY = state.map.y;
        viewport.classList.add("dragging");
        try { viewport.setPointerCapture(event.pointerId); } catch {}
      });

      viewport.addEventListener("pointermove", (event) => {
        if (!state.map.dragging) return;
        state.map.x = state.map.dragOriginX + (event.clientX - state.map.dragStartX);
        state.map.y = state.map.dragOriginY + (event.clientY - state.map.dragStartY);
        applyMapTransform();
      });

      const endDrag = (event) => {
        if (!state.map.dragging) return;
        state.map.dragging = false;
        viewport.classList.remove("dragging");
        try { viewport.releasePointerCapture(event.pointerId); } catch {}
      };
      viewport.addEventListener("pointerup", endDrag);
      viewport.addEventListener("pointercancel", endDrag);
      viewport.addEventListener("pointerleave", endDrag);
    }

            </div>
            <div class="row">
              <button class="btn danger" data-action="flashAgain">Må øve mer</button>
              <button class="btn success" data-action="flashKnown">Kan det</button>
            </div>
          </section>
        </div>
      `;
      $("#formulaSearch").addEventListener("input", (event) => {
        state.formulaQuery = event.target.value;
        renderNotebook();
      });
    }

    function renderSettings() {
      const themes = [
        { id: "nebula", name: "Nebula", text: "Blå/lilla romfølelse", swatch: "linear-gradient(135deg,#56b7ff,#a78bfa,#41e6a0)" },
        { id: "terminal", name: "Terminal", text: "Grønn cyber-lab", swatch: "linear-gradient(135deg,#06130e,#56f5a4,#38e8ff)" },
        { id: "solar", name: "Solar", text: "Varm mørk glød", swatch: "linear-gradient(135deg,#10070c,#ffb86b,#ff8bd1)" }
      ];
      $("#settingsView").innerHTML = `
        ${hero("Innstillinger", "Bytt design og lesestørrelse", "Velg en annen visuell stil for hele nettsiden, og juster skriftstørrelsen så teksten blir behagelig å lese.",
          `<button class="btn" data-action="resetSettings">Tilbakestill</button>`)}
        <div class="settings-grid">
          <section class="setting-card" style="grid-column:span 2;">
            <h3>Design-tema</h3>
            <div class="theme-choice">
              ${themes.map((theme) => `
                <button class="theme-button ${state.theme === theme.id ? "active" : ""}" data-action="setTheme" data-theme="${theme.id}">
                  <span class="theme-swatch" style="--swatch:${theme.swatch}"></span>
                  <span><strong>${theme.name}</strong><br><small>${theme.text}</small></span>
                  <span>${state.theme === theme.id ? "Valgt" : "Velg"}</span>
                </button>
              `).join("")}
            </div>
          </section>
          <section class="setting-card">
            <h3>Skriftstørrelse</h3>
            <div class="range-row">
              <input id="fontScaleRange" type="range" min="0.9" max="1.25" step="0.05" value="${state.fontScale}">
              <strong>${Math.round(state.fontScale * 100)}%</strong>
              <div class="preview-text">Dette er en forhåndsvisning av teksten. Velg større skrift hvis du vil lese mer komfortabelt.</div>
            </div>
          </section>
        </div>
      `;
      $("#fontScaleRange").addEventListener("input", (event) => {
        state.fontScale = Number(event.target.value);
        applySettings();
        save();
        renderSettings();
      });
    }

    function startQuiz() {
      state.quiz.topic = $("#quizTopic").value;
      state.quiz.difficulty = $("#quizDifficulty").value;
      const pool = quizQuestions.filter((item) => {
        const topicOk = state.quiz.topic === "all" || item.topic === state.quiz.topic;
        const diffOk = state.quiz.difficulty === "all" || item.difficulty === state.quiz.difficulty;
        return topicOk && diffOk;
      });
      state.quiz.active = true;
      state.quiz.pool = shuffle(pool).slice(0, Math.min(12, pool.length));
      state.quiz.index = 0;
      state.quiz.score = 0;
      state.quiz.answered = false;
      state.quiz.selected = "";
      state.quiz.good = false;
      renderQuiz();
    }

    function answer(raw) {
      const item = state.quiz.pool[state.quiz.index];
      if (!item || state.quiz.answered) return;
      const accepted = item.type === "choice" ? [item.answer] : item.answers;
      const good = accepted.some((a) => normalize(a) === normalize(raw));
      state.quiz.answered = true;
      state.quiz.selected = raw;
      state.quiz.good = good;
      state.solved += 1;
      if (good) {
        state.correct += 1;
        state.streak += 1;
        state.xp += item.difficulty === "vanskelig" ? 18 : item.difficulty === "middels" ? 14 : 10;
        state.quiz.score += item.difficulty === "vanskelig" ? 18 : item.difficulty === "middels" ? 14 : 10;
        state.mastered[item.topic] = (state.mastered[item.topic] || 0) + 1;
      } else {
        state.streak = 0;
      }
      save();
      renderQuiz();
    }

    function answerInput() {
      answer($("#typedAnswer").value);
    }

    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function numbersFrom(text) {
      return text.split(/[,\s;]+/).map((x) => Number(x.replace(",", "."))).filter((x) => !Number.isNaN(x));
    }

    function calcStats() {
      const nums = numbersFrom($("#statsInput").value);
      if (!nums.length) return $("#statsResult").innerHTML = "Skriv minst ett tall.";
      const sorted = [...nums].sort((a,b) => a-b);
      const sum = nums.reduce((a,b) => a+b, 0);
      const mean = sum / nums.length;
      const mid = Math.floor(sorted.length / 2);
      const median = sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
      const freq = {};
      nums.forEach((n) => freq[n] = (freq[n] || 0) + 1);
      const maxFreq = Math.max(...Object.values(freq));
      const modes = Object.keys(freq).filter((n) => freq[n] === maxFreq && maxFreq > 1);
      const range = sorted[sorted.length - 1] - sorted[0];
      $("#statsResult").innerHTML = `Sortert: ${sorted.join(", ")}<br>Gjennomsnitt: ${mean.toFixed(2)}<br>Median: ${median}<br>Typetall: ${modes.length ? modes.join(", ") : "ingen tydelig"}<br>Variasjonsbredde: ${range}`;
      state.mastered["lab-stat"] = 1;
      state.xp += 2;
      save();
      updateStats();
    }

    function calcVolume() {
      const shape = $("#shapeType").value;
      const r = Number($("#rVal").value.replace(",", "."));
      const h = Number($("#hVal").value.replace(",", "."));
      const d = Number($("#dVal").value.replace(",", "."));
      const rate = Number($("#fillRate").value.replace(",", "."));
      const pi = 3.14;
      let volume = 0;
      let formula = "";
      if (shape === "sylinder") { volume = pi * r * r * h; formula = "πr²h"; }
      if (shape === "halvsylinder") { volume = pi * r * r * h / 2; formula = "πr²h / 2"; }
      if (shape === "kjegle") { volume = pi * r * r * h / 3; formula = "πr²h / 3"; }
      if (shape === "kule") { volume = 4 * pi * r * r * r / 3; formula = "4πr³ / 3"; }
      if (shape === "prisme") { volume = r * h * d; formula = "lengde · bredde · dybde"; }
      const liters = volume * 1000;
      const minutes = rate ? liters / rate : 0;
      $("#volumeResult").innerHTML = `Formel: ${formula}<br>Volum: ${volume.toFixed(3)} m³<br>Liter: ${liters.toFixed(1)} L<br>Fyllingstid: ${minutes.toFixed(2)} min`;
      state.mastered["lab-rom"] = 1;
      state.xp += 2;
      save();
      updateStats();
    }

    function calcPyth() {
      const a = Number($("#aVal").value.replace(",", "."));
      const b = Number($("#bVal").value.replace(",", "."));
      const c = Math.sqrt(a * a + b * b);
      $("#pythResult").innerHTML = `c² = ${a}² + ${b}² = ${(a*a + b*b).toFixed(2)}<br>c = ${c.toFixed(3)}`;
      state.mastered["lab-plan"] = 1;
      state.xp += 2;
      save();
      updateStats();
    }

    function calcComb() {
      const vals = ["c1","c2","c3","c4"].map((id) => Number($(`#${id}`).value.replace(",", ".")) || 0);
      const product = vals.reduce((a,b) => a * b, 1);
      $("#combResult").innerHTML = `${vals.join(" · ")} = <strong>${product}</strong> kombinasjoner.`;
      state.mastered["lab-prob"] = 1;
      state.xp += 2;
      save();
      updateStats();
    }

    document.addEventListener("click", (event) => {
      const el = event.target.closest("[data-action], .nav-btn");
      if (!el) return;
      if (el.classList.contains("nav-btn")) return switchView(el.dataset.view);
      const action = el.dataset.action;
      if (action === "go") switchView(el.dataset.view);
      if (action === "topicGo") { state.topic = el.dataset.topic; switchView("learn"); }
      if (action === "selectTopic") { state.topic = el.dataset.topic; renderLearn(); }
      if (action === "depth") { state.depth = el.dataset.depth; renderLearn(); }
      if (action === "markRead") { state.mastered[`read-${state.topic}`] = 1; state.xp += 6; save(); render(); }
      if (action === "startQuiz") startQuiz();
      if (action === "answerChoice") answer(el.dataset.answer);
      if (action === "answerInput") answerInput();
      if (action === "nextQuestion") { state.quiz.index += 1; state.quiz.answered = false; state.quiz.selected = ""; renderQuiz(); }
      if (action === "resetQuiz") { state.quiz.active = false; renderQuiz(); }
      if (action === "calcStats") calcStats();
      if (action === "calcVolume") calcVolume();
      if (action === "calcPyth") calcPyth();
      if (action === "calcComb") calcComb();
      if (action === "mapZoomIn") { zoomMapAt(window.innerWidth / 2, window.innerHeight / 2, -1); }
      if (action === "mapZoomOut") { zoomMapAt(window.innerWidth / 2, window.innerHeight / 2, 1); }
      if (action === "mapReset") { state.map.zoom = 1; state.map.x = -420; state.map.y = -210; state.map.selected = "stat"; renderMindmap(); }
      if (action === "mapSelect") { state.map.selected = el.dataset.topic; renderMindmap(); }
      if (action === "mapDetail") { state.topic = state.map.selected; switchView("learn"); }
      if (action === "markLab") { state.mastered[`lab-${state.topic}`] = 1; state.xp += 5; save(); render(); }
      if (action === "markExam") { Object.keys(topics).forEach((key) => state.mastered[`exam-${key}`] = 1); state.xp += 10; save(); render(); }
      if (action === "toggleSolution") $(`#solution${el.dataset.index}`).classList.toggle("show");
      if (action === "flipFlash") { state.flash.flipped = !state.flash.flipped; renderNotebook(); }
      if (action === "flashKnown") { state.flash.known += 1; state.flash.index += 1; state.flash.flipped = false; state.xp += 2; save(); renderNotebook(); updateStats(); }
      if (action === "flashAgain") { state.flash.again += 1; state.flash.index += 1; state.flash.flipped = false; renderNotebook(); }
      if (action === "shuffleFlash") { state.flash.index = Math.floor(Math.random() * flashcards.length); state.flash.flipped = false; renderNotebook(); }
      if (action === "setTheme") { state.theme = el.dataset.theme; applySettings(); save(); renderSettings(); }
      if (action === "resetSettings") { state.theme = "nebula"; state.fontScale = 1; applySettings(); save(); renderSettings(); }
    });

    load();
    applySettings();
    render();
  </script>
</body>
</html>
